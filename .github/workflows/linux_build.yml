name: Cloudundancy
on: [push]

jobs:
  build:
    strategy:
      matrix:
         cxx: [clang++, g++]
         cmake_build_type: [Debug, Release]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install lld and ninja-build
        run: sudo apt-get install lld ninja-build

      - name: Install lcov Perl dependencies if g++ Release
        run: sudo apt-get install libcapture-tiny-perl libdatetime-perl
        if: ${{ matrix.cxx == 'g++' && matrix.cmake_build_type == 'Release' }}

      - name: Download ZenUnit.h and MetalMock.h
        run: |
           curl https://raw.githubusercontent.com/NeilJustice/ZenUnitAndMetalMock/main/ZenUnitAndMetalMock/ZenUnit.h --create-dirs -o "$GITHUB_WORKSPACE/ZenUnitAndMetalMock/ZenUnit.h"
           curl https://raw.githubusercontent.com/NeilJustice/ZenUnitAndMetalMock/main/ZenUnitAndMetalMock/MetalMock.h --create-dirs -o "$GITHUB_WORKSPACE/ZenUnitAndMetalMock/MetalMock.h"

      - name: Run LinuxCPlusPlusBuilder in non code coverage mode if clang++ Debug/Release or g++ Debug
        run: |
           LinuxCPlusPlusBuilder build-cpp-solution \
              --solution-name=Cloudundancy \
              --configuration="${{ matrix.cmake_build_type }}" \
              --cmake-definitions="-DFastLinuxDebugBuildMode=ON -DFastLinuxReleaseBuildMode=ON" \
              --install=false
        env:
          CXX: "/usr/bin/${{ matrix.cxx }}"
        if: ${{ matrix.cxx == 'clang++' || (matrix.cxx == 'g++' && matrix.cmake_build_type == 'Debug') }}

      - name: Run LinuxCPlusPlusBuilder in code coverage mode if g++ Release
        run: |
           LinuxCPlusPlusBuilder build-cpp-solution \
              --solution-name=Cloudundancy \
              --configuration="${{ matrix.cmake_build_type }}" \
              --cmake-definitions="-DFastLinuxDebugBuildMode=ON -DFastLinuxReleaseBuildMode=ON -DLCovCodeCoverageMode=ON" \
              --install=false
        env:
          CXX: "/usr/bin/${{ matrix.cxx }}"
        if: ${{ matrix.cxx == 'g++' && matrix.cmake_build_type == 'Release' }}

      - name: Print .comment section of binary libCloudundancyTests to confirm it was linked with LLD
        run: readelf --string-dump .comment "${{matrix.cmake_build_type}}/libCloudundancyTests/libCloudundancyTests"

      - name: Install and run lcov 2.5 then upload to Codecov.io if g++ Release
        run: |
          mkdir -p lcov_2.5
          wget https://github.com/linux-test-project/lcov/releases/download/v2.5/lcov-2.5.tar.gz --output-document="lcov_2.5/lcov-2.5.tar.gz"
          tar xf "lcov_2.5/lcov-2.5.tar.gz" --strip-components=1 --directory lcov_2.5
          lcov_2.5/bin/lcov --version
          lcov_2.5/bin/lcov --directory . --capture --no-external --ignore-errors inconsistent --output-file coverage.info
          lcov_2.5/bin/lcov --list coverage.info
          bash <(curl -s https://codecov.io/bash) -f coverage.info -t ${{ secrets.CODECOV_TOKEN }} || echo "Codecov did not collect coverage reports"
        if: ${{ matrix.cxx == 'g++' && matrix.cmake_build_type == 'Release' }}

      - name: tree GITHUB_WORKSPACE
        run: tree $GITHUB_WORKSPACE
